<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Your business workspace and AI workforce, together in one place.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OG Workforce">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OG Workforce</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #f7f8fb; }
    #app-loading { position: fixed; inset: 0; display: grid; place-items: center; background: #f7f8fb; color: #183b32; font: 500 16px system-ui, sans-serif; }
    #app-loading-content { display: grid; justify-items: center; gap: 16px; }
    #app-loading-mark { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; color: white; background: #183b32; font-size: 29px; }
    #app-loading-track { width: 112px; height: 3px; overflow: hidden; border-radius: 3px; background: #e2e8e5; }
    #app-loading-track::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #b28a4a; animation: app-loading 1.15s ease-in-out infinite alternate; }
    @keyframes app-loading { from { transform: translateX(0); } to { transform: translateX(125%); } }
    @media (prefers-reduced-motion: reduce) { #app-loading-track::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div id="app-loading-content">
      <div id="app-loading-mark" aria-hidden="true">✣</div>
      <div>OG Workforce</div>
      <div id="app-loading-track" aria-hidden="true"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
